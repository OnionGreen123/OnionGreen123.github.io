3" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M874 394H918" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M1106 394H1150" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M54 431H236" stroke="#999" stroke-width="1.5"/><rect x="81" y="406" width="24" height="24" fill="#777"/><rect x="195" y="397" width="30" height="34" fill="none" stroke="#888" stroke-dasharray="4 3"/><path d="M69 356l8 2m-4 -5v8" stroke="#b34343" stroke-width="1.2"/><path d="M129 372l8 2m-4 -5v8" stroke="#b34343" stroke-width="1.2"/><path d="M174 414l8 2m-4 -5v8" stroke="#b34343" stroke-width="1.2"/><path d="M210 363l8 2m-4 -5v8" stroke="#b34343" stroke-width="1.2"/><path d="M112 440l8 2m-4 -5v8" stroke="#b34343" stroke-width="1.2"/><text x="403" y="394" text-anchor="middle" font-size="22">World model</text><text x="1013" y="394" text-anchor="middle" font-size="22">IDM</text><text x="1013" y="419" text-anchor="middle" font-size="12" fill="#666">Inverse dynamics model</text><rect x="565" y="349" width="89" height="91" fill="#fafafa" stroke="#aaa"/><text x="572" y="367" font-size="12" fill="#777">t1</text><path d="M572 424h75" stroke="#aaa"/><rect x="579" y="407" width="16" height="16" fill="#b34343"/><rect x="663" y="349" width="89" height="91" fill="#fafafa" stroke="#aaa"/><text x="670" y="367" font-size="12" fill="#777">t2</text><path d="M670 424h75" stroke="#aaa"/><rect x="698" y="387" width="16" height="16" fill="#b34343"/><rect x="761" y="349" width="89" height="91" fill="#fafafa" stroke="#aaa"/><text x="768" y="367" font-size="12" fill="#777">t3</text><path d="M768 424h75" stroke="#aaa"/><rect x="817" y="367" width="16" height="16" fill="#b34343"/><path d="M1181 430h37l32 -37h37" fill="none" stroke="#777" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1218" cy="430" r="5" fill="white" stroke="#777" stroke-width="2"/><path d="M1287 393l65 -36m-15 0h15v15" fill="none" stroke="#b34343" stroke-width="3"/><text x="145"